<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVault Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">
        <h1>PixelVault Gallery</h1>
        <p>Explore Nature, Flowers, Animals & Cartoons</p>
    </header>

    <div class="filter-bar">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="flower">Flowers</button>
        <button data-filter="animal">Animals</button>
        <button data-filter="cartoon">Cartoons</button>
    </div>

    <div id="gallery"></div>

    <div id="lightbox">
        <span id="closeBtn">&times;</span>
        <button id="prevBtn">❮</button>
        <img id="lightboxImage" src="" alt="Lightbox View">
        <button id="nextBtn">❯</button>
        <div id="imageCounter"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
